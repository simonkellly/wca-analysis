name: Build API

on:
  push:
    branches-ignore:
      - api
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Download WCA export
        run: bun run db

      - name: Build API
        run: bun run api:build

      - name: Verify API output
        run: |
          if [ ! -d "api-output" ] || [ -z "$(ls -A api-output)" ]; then
            echo "Error: api-output directory is missing or empty"
            exit 1
          fi
          echo "API output verified: $(find api-output -type f | wc -l) files"

      - name: Deploy to api branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global core.preloadindex true
          git config --global core.fscache true
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          mv api-output /tmp/api-output-backup
          git branch -D api 2>/dev/null || true
          git checkout --orphan api
          git rm -rf . 2>/dev/null || true
          mv /tmp/api-output-backup/* /tmp/api-output-backup/.[!.]* . 2>/dev/null || mv /tmp/api-output-backup/* .
          rmdir /tmp/api-output-backup 2>/dev/null || true
          git add -A
          git commit -m "Update API - ${{ github.run_id }}"
          git push origin api --force

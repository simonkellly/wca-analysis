name: wca-dev binaries

on:
  workflow_dispatch:
  push:
    paths:
      - "wca-dev/tool/**"
      - ".github/workflows/wca-dev-binaries.yml"

jobs:
  build:
    strategy:
      matrix:
        include:
          - triple: linux-amd64
            target: x86_64-unknown-linux-gnu
            bsdtar: tar_linux_amd64
            os: ubuntu-latest
          - triple: linux-arm64
            target: aarch64-unknown-linux-gnu
            bsdtar: tar_linux_arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build mysqldump-parquet
        working-directory: wca-dev/tool
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binaries
        run: |
          mkdir -p "wca-dev/bin/${{ matrix.triple }}"
          install -m 755 "wca-dev/tool/target/${{ matrix.target }}/release/mysqldump-parquet" \
            "wca-dev/bin/${{ matrix.triple }}/mysqldump-parquet"
          curl -fSL "https://github.com/hermeticbuild/bsdtar-prebuilt/releases/download/v3.8.1-3/${{ matrix.bsdtar }}" \
            -o "wca-dev/bin/${{ matrix.triple }}/bsdtar"
          chmod +x "wca-dev/bin/${{ matrix.triple }}/bsdtar"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.triple }}
          path: wca-dev/bin/${{ matrix.triple }}/
